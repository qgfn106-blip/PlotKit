<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NS 涡旋 · 三维可视化</title>
<style>
  :root { --fg:#e8edf5; --dim:#8b98ad; --panel:rgba(12,16,24,0.72); --line:rgba(120,140,170,0.28); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#05070b; color:var(--fg);
    font:13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #gl { width:100%; height:100%; display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; backdrop-filter:blur(6px); }
  #formulas { top:14px; left:50%; transform:translateX(-50%); padding:6px 10px; max-width:min(760px,86vw); }
  #formulas img { display:block; width:100%; height:auto; opacity:0.95; }
  #clock { top:14px; right:16px; font-variant-numeric:tabular-nums; text-align:right; }
  #clock b { color:#ffb04a; font-weight:600; }
  #diag { left:14px; top:96px; width:270px; font-variant-numeric:tabular-nums; }
  #diag table { width:100%; border-collapse:collapse; }
  #diag td { padding:1px 0; }
  #diag td:last-child { text-align:right; color:#cfe0ff; }
  #diag .sec { color:var(--dim); font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
  #diag .note { color:var(--dim); font-size:11px; margin-top:6px; line-height:1.4; }
  #knobs { right:16px; top:96px; width:230px; }
  #knobs label { display:block; margin:7px 0 2px; color:var(--dim); font-size:11.5px; }
  #knobs input[type=range] { width:100%; accent-color:#ff9c3a; }
  #knobs .val { float:right; color:#cfe0ff; }
  #bar { left:50%; transform:translateX(-50%); bottom:16px; width:min(720px,80vw);
    display:flex; align-items:center; gap:10px; }
  #bar input[type=range] { flex:1; accent-color:#ff9c3a; }
  button { background:#1b2433; color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:#4b6a96; }
  #legend { position:fixed; right:16px; bottom:78px; width:16px; height:180px;
    border-radius:6px; border:1px solid var(--line);
    background:linear-gradient(to top,#383f8f,#29b8a8 55%,#ffb84a); }
  #legend span { position:absolute; right:22px; color:var(--dim); font-size:11px; white-space:nowrap; }
  #mode { position:fixed; left:14px; bottom:16px; color:var(--dim); font-size:11px; max-width:340px; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<div id="formulas" class="panel"><img id="fsvg" alt="公式"></div>

<div id="clock" class="panel">
  <div>τ = <b id="tau">0.500</b></div>
  <div style="color:#8b98ad">t = <span id="tval">0.500</span> · 距奇异 <span id="tleft">0.500</span></div>
</div>

<div id="diag" class="panel">
  <div class="sec">解析（连续场）</div>
  <table id="ana"></table>
  <div class="sec" style="margin-top:8px">网格 N³</div>
  <table id="grd"></table>
  <div class="note" id="note">前导阶自相似解：t→1 时解析量 ≍ τ^(−1/2−h) 发散，网格值受 N 限制。</div>
</div>

<div id="knobs" class="panel">
  <label>h <span class="val" id="vh">0.005</span></label>
  <input id="kh" type="range" min="0" max="0.30" step="0.001" value="0.005">
  <label>X₀ <span class="val" id="vx">0.60</span></label>
  <input id="kx" type="range" min="0.1" max="3.0" step="0.05" value="0.6">
  <label>η₀ <span class="val" id="ve">1.00</span></label>
  <input id="ke" type="range" min="0.3" max="2.5" step="0.05" value="1.0">
  <label>体积密度 <span class="val" id="vd">1.0</span></label>
  <input id="kd" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
  <label>光柱随流 <span class="val" id="vs">0.80</span></label>
  <input id="ks" type="range" min="0" max="1" step="0.05" value="0.8">
  <label>螺旋缠绕 <span class="val" id="vw">2.0</span></label>
  <input id="kw" type="range" min="0" max="6" step="0.25" value="2.0">
  <label>轴向包络 <span class="val" id="vz">0.45</span></label>
  <input id="kz" type="range" min="0" max="1" step="0.05" value="0.45">
  <div class="note" style="margin:-4px 0 6px">显示包络（非物理）：0 = 直柱，1 = 薄盘</div>
  <label>辉光强度 <span class="val" id="vb">0.45</span></label>
  <input id="kb" type="range" min="0" max="2.5" step="0.05" value="0.45">
  <label>箭头长度 <span class="val" id="val">0.10</span></label>
  <input id="ka" type="range" min="0.02" max="0.30" step="0.01" value="0.10">
  <label>播放倍速 <span class="val" id="vrt">1.0×</span></label>
  <input id="kr" type="range" min="0.5" max="8" step="0.5" value="1">
  <label>粒子数 <span class="val" id="vp">200000</span></label>
  <input id="kp" type="range" min="20000" max="300000" step="20000" value="200000">
  <div style="margin-top:8px; display:flex; gap:6px">
    <button id="btn-pt">粒子</button><button id="btn-tr">轨迹</button><button id="btn-ar">矢量</button><button id="btn-top">俯视环盘</button><button id="btn-side">侧视</button><button id="btn-reset">默认视角</button>
  </div>
</div>

<div id="bar" class="panel">
  <button id="play">▶</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="speed" style="color:#8b98ad; font-variant-numeric:tabular-nums">1.0×</span>
</div>

<div id="legend"><span style="bottom:-2px">低</span><span style="top:-2px">高 Ω</span></div>
<div id="mode"></div>

<script src="/nsview.js"></script>
<script>
// 支持 ?t=0.6&h=0.005&x0=0.6&eta0=1.0&particles=120000 直接打开到某一时刻（验收/出图用）
const Q = new URLSearchParams(location.search);
const qnum = (key, dflt) => (Q.has(key) ? Number(Q.get(key)) : dflt);
const S = {
  t: Math.min(0.999, Math.max(0, qnum("t", 0.0))),
  playing: Q.get("play") === "1",
  rate: qnum("rate", 1.0),
  h: qnum("h", 0.005), x0: qnum("x0", 0.6), eta0: qnum("eta0", 1.0),
  particles: qnum("particles", 120000), dirtyField: true, dirtyVel: true, lastVel: 0,
};
const $ = (id) => document.getElementById(id);
let view = null;

function fmt(v, d = 3) { return (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d); }

async function getFrame(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " → " + r.status);
  const buf = await r.arrayBuffer();
  const dv = new DataView(buf);
  const mlen = dv.getUint32(4, true);
  const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, mlen)));
  const data = new Float32Array(buf.slice(8 + mlen));
  return { meta, data };
}

function params() {
  return `h=${S.h}&x0=${S.x0}&eta0=${S.eta0}`;
}

async function loadMeta() {
  const m = await (await fetch("/api/ns/meta")).json();
  $("mode").textContent = m.label;
  $("fsvg").src = "/api/ns/formula.svg";
  S.tBlow = m.params.t_blow;
}

async function loadField() {
  const { meta, data } = await getFrame(`/api/ns/slice?t=${S.t.toFixed(5)}&n_r=256&n_z=384&r_max=0.5&z_max=1.2&${params()}`);
  view.setField(meta, data);
  view.buildRings();
  S.fieldMeta = meta;
}

async function loadVelocity() {
  const { meta, data } = await getFrame(`/api/ns/velocity?t=${S.t.toFixed(5)}&n=48&${params()}`);
  view.setVelocity(meta, data);
}

async function loadTrails() {
  const t1 = Math.max(0.02, S.t);
  const { meta, data } = await getFrame(`/api/ns/pathlines?t0=0&t1=${t1.toFixed(5)}&seeds=96&steps=150&${params()}`);
  view.setTrails(meta, data);
  if (view.trails) view.trails.head = 1.0;
}

async function loadArrows() {
  const { meta, data } = await getFrame(`/api/ns/arrows?t=${S.t.toFixed(5)}&${params()}`);
  S.arrowsMeta = meta; S.arrowsData = data;
  view.setArrows(meta, data);
}

async function loadDiag() {
  const d = await (await fetch(`/api/ns/diagnostics?t=${S.t.toFixed(5)}&${params()}&n=48`)).json();
  const rows = (obj) => {
    if (!obj) return "<tr><td>—</td><td></td></tr>";
    const items = [
      ["u_max", "|u|max", 3], ["omega_max", "|ω|max", 2],
      ["enstrophy", "Enstrophy", 3], ["kinetic", "动能", 4],
      ["core_radius", "涡核半径", 3], ["elongation", "长径比", 2],
      ["divergence_rel", "‖∇·u‖", 3], ["re_theta", "Re_θ", 0],
    ];
    return items.map(([k, label, dg]) => `<tr><td>${label}</td><td>${fmt(obj[k], dg)}</td></tr>`).join("");
  };
  $("ana").innerHTML = rows(d.analytic);
  $("grd").innerHTML = rows(d.grid) + `<tr><td>网格 N</td><td>${d.grid ? d.grid.n_grid : "—"}</td></tr>`;
}

function updateClock() {
  if (view) view.setTime(S.t, S.tBlow);
  $("tau").textContent = (S.tBlow - S.t).toFixed(3);
  $("tval").textContent = S.t.toFixed(3);
  $("tleft").textContent = (S.tBlow - S.t).toFixed(3);
  $("scrub").value = Math.round((S.t / (S.tBlow || 1)) * 1000);
}

let refreshTimer = null;
let refreshQueued = null;
// mode: true/"all" = 场+速度+诊断(+轨迹)；"field" = 只换纹理（播放时用）；"slow" = 速度+诊断
function scheduleRefresh(mode) {
  refreshQueued = refreshQueued === "all" ? "all" : (mode === true ? "all" : mode);
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    const m = refreshQueued; refreshQueued = null;
    if (S.busy) { scheduleRefresh(m); return; }   // 上一批还没回来，别叠加请求
    S.busy = true;
    try {
      await loadField();
      await loadArrows();
      if (m !== "field") { await loadVelocity(); await loadDiag(); }
      if (m === "all") await loadTrails();
    } catch (e) { console.error(e); }
    finally { S.busy = false; }
  }, mode === "field" ? 60 : 90);
}

function bind() {
  const kh = $("kh"), kx = $("kx"), ke = $("ke"), kd = $("kd"), kp = $("kp"),
        ks = $("ks"), kw = $("kw"), kb = $("kb");
  kh.oninput = () => { S.h = +kh.value; $("vh").textContent = S.h.toFixed(3); scheduleRefresh(true); };
  kx.oninput = () => { S.x0 = +kx.value; $("vx").textContent = S.x0.toFixed(2); scheduleRefresh(true); };
  ke.oninput = () => { S.eta0 = +ke.value; $("ve").textContent = S.eta0.toFixed(2); scheduleRefresh(true); };
  kd.oninput = () => { view.settings.density = +kd.value; $("vd").textContent = (+kd.value).toFixed(1); };
  ks.oninput = () => { view.settings.streaks = +ks.value; $("vs").textContent = (+ks.value).toFixed(2); };
  kw.oninput = () => { view.settings.spin = +kw.value; $("vw").textContent = (+kw.value).toFixed(1); };
  kb.oninput = () => { view.settings.bloom = +kb.value; $("vb").textContent = (+kb.value).toFixed(2); };
  $("kz").oninput = () => { view.settings.envelope = +$("kz").value; $("vz").textContent = (+$("kz").value).toFixed(2); };
  kp.oninput = () => {
    S.particles = +kp.value; $("vp").textContent = S.particles;
    view.seedParticles(S.particles);
  };
  $("btn-pt").onclick = () => { view.settings.showParticles = !view.settings.showParticles; };
  $("btn-tr").onclick = () => { view.settings.showTrails = !view.settings.showTrails; };
  $("btn-ar").onclick = () => { view.settings.showArrows = !view.settings.showArrows; };
  $("ka").oninput = () => {
    view.settings.arrowLen = +$("ka").value; $("val").textContent = (+$("ka").value).toFixed(2);
    if (S.fieldMeta) view.setArrows(S.arrowsMeta || S.fieldMeta, S.arrowsData || new Float32Array(0));
  };
  $("kr").oninput = () => { S.rate = +$("kr").value; $("vrt").textContent = (+$("kr").value).toFixed(1) + "×"; };
  $("btn-top").onclick = () => view.setPreset("top");
  $("btn-side").onclick = () => view.setPreset("side");
  $("btn-reset").onclick = () => view.setPreset("home");

  $("scrub").oninput = () => {
    if (S.playing) { S.playing = false; $("play").textContent = "▶"; }
    S.t = Math.min(0.999, +$("scrub").value / 1000) * (S.tBlow || 1);
    updateClock(); scheduleRefresh(true);      // true: 轨迹也跟着走，画面与时钟才对齐
  };
  $("play").onclick = () => {
    S.playing = !S.playing;
    $("play").textContent = S.playing ? "❚❚" : "▶";
  };
}

function tick(now) {
  if (S.playing) {
    S.t += (now - (S._prev || now)) / 1000 * 0.02 * S.rate * (S.tBlow || 1);
    if (S.t >= 0.999 * (S.tBlow || 1)) S.t = 0.0;
    updateClock();
    // 播放时只刷"场纹理"，速度场/诊断放慢到 900ms —— 否则每 120ms 串三个请求会把
    // requestAnimationFrame 饿死，看起来就是"时间轴不动、画面卡住"。
    if (now - S.lastVel > 180) { S.lastVel = now; scheduleRefresh("field"); }
    if (now - S.lastSlow > 900) { S.lastSlow = now; scheduleRefresh("slow"); }
  }
  S._prev = now;
  requestAnimationFrame(tick);
}

(async function main() {
  view = new NS.NSView($("gl"));
  view.onStats = (s) => { S.fps = s.fps; };
  window.__ns = { view, S };
  bind();
  const guard = async (name, fn) => { try { await fn(); } catch (e) { (window.__nsErr = window.__nsErr || []).push(name + ": " + e); console.error(name, e); } };
  await guard("meta", loadMeta);
  await guard("field", loadField);
  await guard("velocity", loadVelocity);
  await guard("arrows", loadArrows);
  await guard("trails", loadTrails);
  await guard("diag", loadDiag);
  view.seedParticles(S.particles);
  updateClock();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
