[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotkit"
version = "0.1.0"
description = "一套 spec，两种后端：plotly.js 交互 / matplotlib 静态（离线、零 CDN）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PlotKit" }]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
mpl = ["matplotlib>=3.5"]
desktop = ["PySide6>=6.5"]
all = ["fastapi>=0.110", "uvicorn>=0.27", "matplotlib>=3.5"]
dev = ["pytest>=7", "httpx>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plotkit = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
